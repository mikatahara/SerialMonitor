<!DOCTYPE html>
<html lang="en">
	
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<script src="https://mikatahara.github.io/mywebmidiapi.js"></script>
	<script src="https://mikatahara.github.io/jquery-1.11.2.min.js"></script>
	<script src="serialapi.js"></script>

	<link rel="stylesheet" media="screen" href="serialmonitor.css">
	<link rel="manifest" href="./manifest.json">
	<title>SERIAL MONITOR</title>

</head>

<body>

<!-- ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ -->

<h2>Serial Monitor</h2>
<button id="serial_start">Start & Read</button>

<select id="baud">
<option value="0">1200</option>
<option value="1">2400</option>
<option value="2">4800</option>
<option value="3">9600</option>
<option value="4">19200</option>
<option value="5">38400</option>
<option value="6">57600</option>
<option value="7">74880</option>
<option value="8" selected>115200</option>
<option value="9">230400</option>
</select>

<button id="stop">STOP</button>
<button id="restart">RESTART</button>
<button id="close">CLOSE</button>
<button id="clear">CLEAR</button><br>
<button id="bin">TEXT</button>
<input type="text" id="wtxt">
<button id="write">WRITE</button><br>

<div id="log"></div>

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7W70818VR0');
</script>

</body>
</html>
